<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>选调生去向信息检索系统</title>
<link rel="stylesheet" href="/styles.css" />
</head>
<body>

<header class="topbar">
  <div class="brand"><span class="logo">选</span><span>选调生去向信息检索</span></div>
  <nav>
    <a href="/" class="active">检索</a>
    <a href="/stats.html">统计分析</a>
      <a href="/docs" target="_blank" rel="noopener">接口文档</a>
  </nav>
</header>

<div class="layout">

  <!-- ============ 左侧：筛选面板 ============ -->
  <aside class="sidebar">
    <h2>已选条件</h2>
    <div id="tagbar" class="tagbar"></div>

    <h2 style="margin-top:14px;">筛选条件</h2>
    <div id="facets">
      <div class="facet-group"><div style="color:#6b7280;font-size:13px;padding:6px 0;">筛选条件加载中…</div></div>
    </div>
  </aside>

  <!-- ============ 右侧：检索与结果 ============ -->
  <section>
    <div class="searchbar">
      <input id="q" type="search" autocomplete="off" spellcheck="false"
             placeholder="输入姓名 / 拼音（zhangsan 或 zs）/ 学院 / 专业 / 省份 / 单位…" />
      <button id="btn-search" class="btn">搜索</button>
      <div id="suggest" class="suggest"></div>
    </div>
    <div class="pinyin-hint">
      支持拼音检索：<kbd>zhangsan</kbd> 全拼、<kbd>zs</kbd> 声母缩写均可命中「张三」；多个关键词用空格分隔（默认为「与」）。
    </div>

    <div class="toolbar">
      <span id="summary" class="summary">准备就绪</span>
      <div class="spacer"></div>
      <div class="viewswitch" id="viewswitch">
        <button data-view="card" class="active">卡片</button>
        <button data-view="table">表格</button>
      </div>
      <select id="sort" title="排序方式"></select>
      <select id="page-size" title="每页条数">
        <option value="10">每页 10 条</option>
        <option value="20" selected>每页 20 条</option>
        <option value="50">每页 50 条</option>
        <option value="100">每页 100 条</option>
      </select>
    </div>

    <div id="results"></div>
    <div id="pager" class="pager"></div>
  </section>
</div>

<script src="/common.js"></script>
<script src="/app.js"></script>
</body>
</html>
