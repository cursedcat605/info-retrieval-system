# ============================================================================ #
# 模糊匹配词表（人工维护）
# ============================================================================ #
# 作用：搜索框输入「信工」时，也能检索到库里实际写的「信息工程学院」。
#
# 为什么要有这个文件？
#   OCR 抽出来的是完整写法（学院/专业的正式名称），但用户习惯敲简写、别称。
#   这类映射是**业务知识**，算法推不出来，只能人工维护 —— 所以放在这里，
#   既不在前端（改前端不生效也不该让前端决定业务词表），也不在数据库
#   （data/ 每次重建都会被覆盖）。
#
# 改完**不需要重启服务**：文件修改时间一变，检索时会自动重新加载。
# 改完可以直接在搜索框里敲别名验证；没生效先看 `logs/` 里有没有
# `模糊匹配词表` 相关的 WARNING（通常是 YAML 语法写错或缩进不对）。
#
# ---------------------------------------------------------------------------- #
# 写法（两种，可混用）
# ---------------------------------------------------------------------------- #
# ① groups：一组等价写法，canonical 是库里实际出现的写法（放第一个）
#      groups:
#        - canonical: 信息工程学院
#          aliases: [信工, 信工院]
#
# ② aliases：别名 → 主词 的简写形式
#      aliases:
#        信工: 信息工程学院
#
# 规则与注意事项
#   · 组内任意一个词被搜到时，整组都会被拿来检索（组内是「或」）；
#   · 多个组里出现同一个词时，这些组会**自动合并**，所以同一个别名写在多处没问题；
#   · 别名请写「简写/别称」，不要把已经是子串的写法加进来（如「经济」之于
#     「经济学院」）—— 子串本来就能被普通检索命中，加了只会白费；
#   · 同一个别名如果指向两个不同的意思（如「新传」既可能是学院也可能是专业），
#     两边都写进 groups 即可，搜「新传」会把两边都带出来（这是有意为之）；
#   · 某个别名只在极少数的图里出现、且是一对一的固定简写时，也可以考虑用
#     `config/corrections.yaml` 直接改文本，而不是在这里加扩展词。
# ============================================================================ #

groups:
  # ---------------------------- 学院 ---------------------------- #
  - canonical: 信息工程学院
    aliases: [信工, 信工院]
    note: "最常见的简写场景"

  - canonical: 民族学与社会学学院
    aliases: [民社, 民社学院, 民社院]

  - canonical: 生命与环境科学学院
    aliases: [生环, 生环学院]

  - canonical: 中国少数民族语言文学学院
    aliases: [少语学院]

  - canonical: 历史文化学院
    aliases: [历文, 历文学院]

  - canonical: 哲学与宗教学学院
    aliases: [哲宗, 哲宗学院]

  - canonical: 新闻与传播学院
    aliases: [新传, 新传学院]

  - canonical: 外国语学院
    aliases: [外院]

  - canonical: 教育学院
    aliases: [教院]

  - canonical: 管理学院
    aliases: [管院]

  - canonical: 经济学院
    aliases: [经院]

  - canonical: 文学院
    aliases: [文院]

  # ---------------------------- 专业 ---------------------------- #
  - canonical: 计算机科学与技术
    aliases: [计科]

  - canonical: 数据科学与大数据技术
    aliases: [大数据, 数科]

  - canonical: 行政管理
    aliases: [行管]

  - canonical: 社会工作
    aliases: [社工]

  - canonical: 应用统计
    aliases: [应统]

  - canonical: 国际商务
    aliases: [国商]

  - canonical: 国际经济与贸易
    aliases: [国贸]

  - canonical: 人力资源管理
    aliases: [人资, 人力资源]

  - canonical: 文物与博物馆学
    aliases: [文博]

  # 新闻与传播：和上面的「新闻与传播学院」共用「新传」，两组会自动合并
  - canonical: 新闻与传播
    aliases: [新传]

# ---------------------------------------------------------------------------- #
# 简写写法示例（想用这种就取消注释；和上面的 groups 可以同时存在）
# ---------------------------------------------------------------------------- #
aliases:
  # 中央民族大学: 民大
  # 云南省: 云南
