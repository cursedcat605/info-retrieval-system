# ============================================================================ #
# 人工纠错层
# ============================================================================ #
# 这个文件是**唯一**适合手工改数据的地方。
#
# 为什么不直接改 data/ 下的文件？
#   · data/interim/ocr_text/*.json|txt  —— run_ocr.py --force 会覆盖
#   · data/processed/*                  —— extract_records.py 每次全量重写
#   · data/db/selects.sqlite            —— build_database.py --reset 会清空重建
# 而本文件的规则是在**每次重跑流水线时**都会生效的，所以改得动、也改不丢。
#
# 改完务必重跑：
#   python scripts\extract_records.py
#   python scripts\build_database.py --reset
#
# 每次跑完后 extract_records.py 会打印"未命中的规则"—— 如果你的修改没生效，
# 先看那里：通常意味着图片名写错、或者 from 的字符串和实际文本不一致。
#
# 图片名可以写 `xxx.jpg`，也可以只写去扩展名的 `xxx`，两种都能对上。
# 字符串里的空格/全角字符不用管：规则作用在**清洗后**的文本上。
#
# ⚠️ 隐私：本文件会进 git，而 data/ 不会。
#    **不要写真实姓名**；需要按人定位时，优先用下文的 block_index。
# ============================================================================ #


# ---------------------------------------------------------------------------- #
# ① 文本层：替换文字本身
# ---------------------------------------------------------------------------- #
# 作用时机：清洗后、字段抽取前。适合改 OCR 固定认错的字。
# 注意：**文本没错、只是切分规则切错了**的情况不要写在这里（改不动），
#       那种要用下面的「字段层」。
text:
  # 全局规则：所有图片都生效。只放"任何场景下都是错字"的替换。
  global: []
    # - from: "选调牛"
    #   to: "选调生"
    # - from: "民旋大学"
    #   to: "民族大学"
    # - regex: true                  # 需要正则时加这个开关
    #   from: "第(\\d)届"
    #   to: "20\\1届"                # 反斜杠在 YAML 双引号里要写两个

  # 按图片规则：只对该图片生效。
  images: {}
    # 20231129_238345_01_广东选调:   # 带不带 .jpg 都行
    #   - from: "科生湛江"          # 上一行的尾巴被粘进来了
    #     to: "湛江"


# ---------------------------------------------------------------------------- #
# ② 字段层：直接改写抽取结果
# ---------------------------------------------------------------------------- #
# 作用时机：字段抽取完成后。适合"文本本身没错，是切分规则切错了"的情况。
#
# 定位方式（二选一）：
#   · block_index —— 按"该图片内的第几条记录"匹配（0 开始）。**推荐**：
#                    不涉及隐私、也不需要把姓名写进会进 git 的文件。
#   · name        —— 按姓名匹配，可读性最好；但姓名是隐私，慎用。
#
# 两种写法：
#   扁平：除 name / block_index / set / note 外的键都当作"要覆盖的字段"
#       - block_index: 0
#         city: 湛江市
#   嵌套：用 set 显式列出要覆盖的字段，因此**可以改 name 本身**
#       - block_index: 0
#         set: {city: 湛江市}
#
# 可用字段：name / cohort / cohort_year / college / major /
#           destination_org / city / province / position / degree
fields:
  # 案例：城市正则把上一行的「…本科生」粘了进来，切出了「科生湛江市」。
  #       文本本身是干净的两行，改规则改不动，所以在这里定点覆盖。
  #       该图片只有 1 条记录，故用 block_index: 0 定位（不写姓名）。
  20231129_238345_01_广东选调:
    - block_index: 0
      note: "城市正则把上一行的『本科生』粘了进来（科生湛江市）→ 湛江市"
      city: 湛江市
